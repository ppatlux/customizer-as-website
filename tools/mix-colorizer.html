<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mix Colorizer</title>
  <meta name="description" content="Author per-part colours for the ready-made mixes shown on the HP Robot Customizer's Mixes tab">
  <link rel="stylesheet" href="./mix-colorizer.css">
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"
    integrity="sha384-yA2h8FH0n05oFfnN0jT8J2B7OWemrtBIs3Qrc59zOTdZqvwBJMp+YJLsYdCa03Cx" crossorigin="anonymous"></script>
  <script type="importmap">
    {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/"
    },
    "integrity": {
      "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js": "sha384-LJXWwbN59doWCYk3H8sqfu+HCDzM24TGLJAVGMJ/xaGxE+Cuz6fm71lj4UT98Mf4",
      "https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/controls/OrbitControls.js": "sha384-/tEDPYER5v0QO0LFWngHYaAW2bBF/PvZG/uWTlF9NRG6dZYKl4KFlmh1qvM0CWif",
      "https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/loaders/GLTFLoader.js": "sha384-rXJhXot3b4g36jj6PY0MTYCWms0s0srcu3Ga+pAOKfH0cWSEK/j+rcL27N9T1v/y"
    }
    }
  </script>
</head>
<body>
  <header id="topbar">
    <h1>Mix Colorizer</h1>
    <p class="hint">Click a part in the view, choose <b>Whole part</b> or <b>This piece</b>, then pick a colour. Drives the Mixes-tab thumbnails only.</p>
    <div id="topbar-actions">
      <button id="connectBtn" type="button">Connect save file&hellip;</button>
      <button id="downloadBtn" type="button">Download JSON</button>
      <span id="saveStatus"></span>
    </div>
  </header>

  <main id="layout">
    <nav id="mixList" aria-label="Mixes"></nav>

    <section id="viewerPane">
      <div id="viewerHost"></div>
      <p id="viewerHint">Loading&hellip;</p>
    </section>

    <aside id="inspector">
      <h2>Selection</h2>
      <p id="selectedInfo" class="muted">Click a part in the view</p>

      <ul id="targetList" aria-label="Paint target"></ul>

      <div id="swatches" aria-label="Preset colours"></div>

      <label id="customColorRow">
        <span>Custom</span>
        <input type="color" id="customColor" value="#e6e6e6">
      </label>

      <button id="resetTargetBtn" type="button" disabled>Reset</button>
      <button id="resetMixBtn" type="button">Reset whole mix</button>

      <h2>This mix's colours</h2>
      <ul id="partColorList"></ul>
    </aside>
  </main>

  <script type="module" src="./mix-colorizer.js"></script>
</body>
</html>
